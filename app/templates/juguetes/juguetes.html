<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juguetes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/categorias/juguetes/juguetes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/carousel/carousel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menu-toggle/menu-toggle.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="hamburger-menu">
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle" class="hamburger-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
            </div>
            <ul class="menu">
                <li><a href="{{ url_for('home') }}">Inicio</a></li>
                <li><a href="{{ url_for('productos') }}">Productos</a></li>
                <li><a href="{{ url_for('ropa') }}">Ropa & Accesorios</a></li>
                <li><a href="{{ url_for('bebidas') }}">Bebidas</a></li>
                <li><a href="{{ url_for('juguetes') }}">Juguetes</a></li>
                <li><a href="{{ url_for('salud') }}">Salud & Belleza</a></li>
                <li><a href="{{ url_for('auth.login') }}">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero-section">
            <div class="hero-text">
                <h1>Juguetes</h1>
            </div>
            <img src="{{ url_for('static', filename='img/juguetes/fondo.jpg') }}" alt="Fondo Juguetes" class="hero-image">
        </div>
        <section class="carousel">
            <div class="carousel-container">
                <div class="product-item">
                    <a href="{{ url_for('producto_detalle', producto_nombre='pc_gamer') }}">
                        <img src="{{ url_for('static', filename='img/juguetes/carrito.jpg') }}" alt="Carrito">
                        <h2>Carrito</h2>
                    </a>
                </div>
                <div class="product-item">
                    <a href="{{ url_for('producto_detalle', producto_nombre='laptop_gamer') }}">
                        <img src="{{ url_for('static', filename='img/juguetes/maquillaje.jpg') }}" alt="Maquillaje">
                        <h2>Maquillaje</h2>
                    </a>
                </div>
                <div class="product-item">
                    <a href="{{ url_for('producto_detalle', producto_nombre='teclado') }}">
                        <img src="{{ url_for('static', filename='img/juguetes/peluche.jpg') }}" alt="Peluche">
                        <h2>Peluche</h2>
                    </a>
                </div>
                <div class="product-item">
                    <a href="{{ url_for('producto_detalle', producto_nombre='mouse') }}">
                        <img src="{{ url_for('static', filename='img/juguetes/tiburones.jpg') }}" alt="Tiburones">
                        <h2>Tiburones</h2>
                    </a>
                </div>
                <div class="product-item">
                    <a href="{{ url_for('producto_detalle', producto_nombre='ram') }}">
                        <img src="{{ url_for('static', filename='img/juguetes/lego.jpg') }}" alt="Lego">
                        <h2>Lego</h2>
                    </a>
                </div>
            </div>
        </section>

    </main>
    <footer>
        <p>&copy; 2024 Tu Marca. Todos los derechos reservados.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/car-animations/car-animations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/menu-toggle/menu-toggle.js') }}"></script>
