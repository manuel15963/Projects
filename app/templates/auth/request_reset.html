<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Password Reset</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/request_reset.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">Request Password Reset</h2>
                        <form action="{{ url_for('password_reset.request_reset') }}" method="post">
                            {{ form.hidden_tag() }}
                            <div class="form-group">
                                {{ form.email.label }} {{ form.email(class_='form-control') }}
                            </div>
                            <div class="form-group">
                                {{ form.submit(class_='btn btn-primary') }}
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
